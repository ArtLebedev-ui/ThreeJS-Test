<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вакансии — мягкий фон</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        color: #f4f4f4;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #050505;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 20% -20%, #1b2234, #07090f 65%);
        overflow: hidden;
      }

      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .content {
        position: relative;
        text-align: left;
        max-width: 520px;
        padding: 2.75rem 3rem;
        backdrop-filter: blur(16px);
        background: rgba(9, 11, 18, 0.58);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 18px;
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.45);
      }

      h1 {
        font-weight: 600;
        letter-spacing: 0.2rem;
        margin-bottom: 1rem;
        text-transform: uppercase;
      }

      p {
        color: rgba(255, 255, 255, 0.7);
        font-size: 1.05rem;
        line-height: 1.65;
        letter-spacing: 0.02rem;
      }

      .eyebrow {
        font-size: 0.85rem;
        letter-spacing: 0.35rem;
        text-transform: uppercase;
        display: block;
        margin-bottom: 0.5rem;
        color: rgba(255, 255, 255, 0.45);
      }
    </style>
  </head>
  <body>
    <canvas id="grain"></canvas>
    <div class="content">
      <span class="eyebrow">команда</span>
      <h1>Вакансии</h1>
      <p>
        Мы ищем людей, которым близок наш темп работы и подход к продукту.
        Неброский фон подчёркивает контент и не отвлекает кандидатов.
      </p>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
