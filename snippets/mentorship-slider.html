<!-- Mentorship slider embed with synced content + image transitions -->
<div class="flex_slides">
  <div class="cms_slider" data-slider="mentorship">
    <div class="controls">
      <div class="arrow-left"><img src="https://cdn.prod.website-files.com/69014633b3494c3d0ef793fc/69095b328c1ed1f42d098ac8_arrow-left.svg" loading="lazy" alt="Previous"></div>
      <div class="title_bar_txt">Practitioner Support</div>
      <div class="arrow-right"><img src="https://cdn.prod.website-files.com/69014633b3494c3d0ef793fc/69095b333dd09a0978d79778_arrow-right.svg" loading="lazy" alt="Next"></div>
    </div>

    <div class="w-dyn-list">
      <div role="list" class="w-dyn-items">
        <!-- Each mentorship-slide should carry data-control-title to feed the controls text -->
        <div role="listitem" class="mentorship-slide w-dyn-item is-active" data-control-title="Practitioner Support">
          <div class="content_slider">
            <div class="headline_slide">
              <div class="mentorship-title">Live High</div>
            </div>
            <div class="description_mentorship">
              <div class="b_txt">A constantly growing library of clinical, psychological, and business calls...</div>
            </div>
            <div class="button_container">
              <a href="#" class="button_general w-inline-block">
                <div class="g_button_txt"><div>All Seminars</div></div>
                <div class="arrow_button">
                  <img src="https://cdn.prod.website-files.com/69014633b3494c3d0ef793fc/6906744bc45e42ad5fe6cd95_arrow_header.svg" loading="lazy" alt="">
                </div>
              </a>
            </div>
          </div>
        </div>
        <!-- Duplicate CMS items continue here -->
      </div>
    </div>
  </div>

  <div class="image_collections">
    <div class="thumbnails_list">
      <div class="thumbnail_box">
        <img src="https://cdn.prod.website-files.com/69014633b3494c3d0ef793fc/690b8a1136cd0d6ef48842f3_img-1.avif"
             data-main-src="https://cdn.prod.website-files.com/69014633b3494c3d0ef793fc/690b8a1136cd0d6ef48842f3_img-1.avif"
             data-main-srcset="https://cdn.prod.website-files.com/69014633b3494c3d0ef793fc/690b8a1136cd0d6ef48842f3_img-1-p-500.avif 500w, https://cdn.prod.website-files.com/69014633b3494c3d0ef793fc/690b8a1136cd0d6ef48842f3_img-1-p-800.avif 800w, https://cdn.prod.website-files.com/69014633b3494c3d0ef793fc/690b8a1136cd0d6ef48842f3_img-1.avif 1556w"
             alt="Smiling female dentist in a white coat showing a dental model to a seated patient." class="thumbnail_image">
      </div>
      <!-- ... more thumbnails ... -->
    </div>

    <div class="main_slide">
      <img src="https://cdn.prod.website-files.com/69014633b3494c3d0ef793fc/690b8a11db49a7507e75e463_img-2.avif"
           sizes="(max-width: 1556px) 100vw, 1556px"
           srcset="https://cdn.prod.website-files.com/69014633b3494c3d0ef793fc/690b8a11db49a7507e75e463_img-2-p-500.avif 500w, https://cdn.prod.website-files.com/69014633b3494c3d0ef793fc/690b8a11db49a7507e75e463_img-2.avif 1556w"
           alt="Smiling female dentist in a white coat showing a dental model to a seated patient."
           class="main_image">
    </div>
  </div>
</div>

<script>
window.addEventListener("load", () => {
  const component = document.querySelector(".flex_slides");
  if (!component) return;

  const slider =
    component.querySelector(".cms_slider[data-slider='mentorship']") ||
    component.querySelector(".cms_slider");
  const slides = Array.from(component.querySelectorAll(".mentorship-slide"));
  const thumbs = Array.from(component.querySelectorAll(".thumbnail_box"));
  const mainImage = component.querySelector(".main_image");
  const titleBar = component.querySelector(".title_bar_txt");
  const next = component.querySelector(".arrow-right");
  const prev = component.querySelector(".arrow-left");

  if (!slider || !slides.length || !thumbs.length || !mainImage || !titleBar) return;

  const AUTOPLAY_DELAY = 8000;
  const BLUR_IN = "blur(18px)";
  const BLUR_OUT = "blur(12px)";
  const EASE_OUT = "power3.out";
  const EASE_IN = "power3.inOut";

  let current = 0;
  let autoplayId = null;
  let resizeTimeout = null;
  let isAnimating = false;
  let pendingIndex = null;

  const lineCache = new WeakMap();
  const partsCache = new WeakMap();

  const slideMeta = slides.map((slide, index) => {
    const thumbBox = thumbs[index] || thumbs[0];
    const thumbImg = thumbBox?.querySelector("img");
    return {
      slide,
      controlTitle:
        slide.getAttribute("data-control-title") ||
        thumbImg?.getAttribute("alt") ||
        slide.querySelector(".mentorship-title")?.textContent.trim() ||
        "",
      imageSrc: thumbImg?.dataset.mainSrc || thumbImg?.currentSrc || thumbImg?.src || "",
      imageSrcset: thumbImg?.dataset.mainSrcset || thumbImg?.getAttribute("srcset") || ""
    };
  });

  const setSliderHeight = () => {
    const maxHeight = Math.max(...slides.map(slide => slide.scrollHeight));
    slider.style.setProperty("--mentorship-max-height", `${maxHeight}px`);
    slider.style.minHeight = `${maxHeight}px`;
  };

  setSliderHeight();
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(setSliderHeight, 120);
  });

  function splitLines(slide) {
    if (!slide) return [];
    const cached = lineCache.get(slide);
    if (cached) return cached;

    const targets = [
      slide.querySelector(".mentorship-title"),
      slide.querySelector(".description_mentorship .b_txt")
    ].filter(Boolean);

    let lines = [];
    if (typeof SplitType !== "undefined" && targets.length) {
      const instances = targets.map(el => new SplitType(el, { types: "lines", tagName: "div" }));
      lines = instances.flatMap(inst => inst.lines || []);
    } else {
      lines = targets;
    }

    lineCache.set(slide, lines);
    return lines;
  }

  function getSlideParts(slide) {
    if (!slide) return { lines: [], button: null };
    const cached = partsCache.get(slide);
    if (cached) return cached;

    const parts = {
      lines: splitLines(slide),
      button: slide.querySelector(".button_container")
    };

    partsCache.set(slide, parts);
    return parts;
  }

  function animateTitle(newIndex) {
    const tl = gsap.timeline({ defaults: { duration: 0.32, ease: EASE_IN } });
    tl.to(titleBar, { autoAlpha: 0, yPercent: 40 })
      .add(() => {
        titleBar.textContent = slideMeta[newIndex].controlTitle;
      })
      .to(titleBar, { autoAlpha: 1, yPercent: 0 });
  }

  function swapImage(newIndex) {
    const { imageSrc, imageSrcset } = slideMeta[newIndex];
    if (!imageSrc) return;

    gsap.to(mainImage, {
      autoAlpha: 0,
      duration: 0.32,
      ease: EASE_IN,
      onComplete: () => {
        mainImage.src = imageSrc;
        if (imageSrcset) mainImage.srcset = imageSrcset;
        gsap.to(mainImage, { autoAlpha: 1, duration: 0.34, ease: EASE_OUT });
      }
    });
  }

  function updateThumbs(newIndex) {
    thumbs.forEach((thumb, idx) => thumb.classList.toggle("is-active", idx === newIndex));
  }

  function animateContentTransition(newIndex) {
    if (isAnimating) {
      pendingIndex = newIndex;
      return false;
    }

    const outgoing = slides[current];
    const incoming = slides[newIndex];
    if (!outgoing || !incoming) return false;

    const outgoingParts = getSlideParts(outgoing);
    const incomingParts = getSlideParts(incoming);
    isAnimating = true;

    incoming.classList.add("is-active");
    gsap.set(incoming, { autoAlpha: 0, yPercent: 6 });
    gsap.set(incomingParts.lines, {
      opacity: 0,
      yPercent: 30,
      z: -120,
      rotateX: 10,
      filter: BLUR_IN
    });
    if (incomingParts.button) {
      gsap.set(incomingParts.button, {
        opacity: 0,
        yPercent: 35,
        filter: BLUR_IN
      });
    }

    const tl = gsap.timeline({
      defaults: { ease: EASE_IN },
      onComplete: () => {
        outgoing.classList.remove("is-active");
        gsap.set([...outgoingParts.lines, ...incomingParts.lines], { clearProps: "all" });
        if (outgoingParts.button) gsap.set(outgoingParts.button, { clearProps: "all" });
        if (incomingParts.button) gsap.set(incomingParts.button, { clearProps: "all" });
        gsap.set(outgoing, { clearProps: "autoAlpha,yPercent" });
        isAnimating = false;

        if (pendingIndex !== null) {
          const queuedIndex = pendingIndex;
          pendingIndex = null;
          showSlide(queuedIndex);
        }
      }
    });

    tl.to(outgoingParts.lines, {
      opacity: 0,
      yPercent: -25,
      z: -140,
      rotateX: -10,
      filter: BLUR_OUT,
      duration: 0.36,
      stagger: 0.06
    }, 0)
      .to(outgoing, { autoAlpha: 0, duration: 0.28, ease: EASE_IN }, 0)
      .to(outgoingParts.button, {
        opacity: 0,
        yPercent: -20,
        filter: BLUR_OUT,
        duration: 0.28
      }, "<0.05")
      .to(incoming, { autoAlpha: 1, yPercent: 0, duration: 0.32, ease: EASE_OUT }, 0.12)
      .to(incomingParts.lines, {
        opacity: 1,
        yPercent: 0,
        z: 0,
        rotateX: 0,
        filter: "blur(0px)",
        duration: 0.48,
        stagger: 0.06,
        ease: EASE_OUT
      }, "<0.04")
      .to(incomingParts.button, {
        opacity: 1,
        yPercent: 0,
        filter: "blur(0px)",
        duration: 0.34,
        ease: EASE_OUT
      }, "<0.05");

    return true;
  }

  function showSlide(newIndex) {
    if (newIndex === current || !slides[newIndex]) return;
    const started = animateContentTransition(newIndex);
    if (!started) {
      pendingIndex = newIndex;
      return;
    }

    animateTitle(newIndex);
    swapImage(newIndex);
    updateThumbs(newIndex);
    current = newIndex;
    restartAutoplay();
  }

  function goNext() {
    const nextIndex = (current + 1) % slides.length;
    showSlide(nextIndex);
  }

  function goPrev() {
    const prevIndex = (current - 1 + slides.length) % slides.length;
    showSlide(prevIndex);
  }

  function startAutoplay() {
    if (autoplayId) return;
    autoplayId = window.setInterval(goNext, AUTOPLAY_DELAY);
  }

  function stopAutoplay() {
    if (!autoplayId) return;
    window.clearInterval(autoplayId);
    autoplayId = null;
  }

  function restartAutoplay() {
    stopAutoplay();
    startAutoplay();
  }

  next?.addEventListener("click", () => {
    stopAutoplay();
    goNext();
  });

  prev?.addEventListener("click", () => {
    stopAutoplay();
    goPrev();
  });

  thumbs.forEach((thumb, index) => {
    thumb.addEventListener("click", () => {
      stopAutoplay();
      showSlide(index);
    });
  });

  slides[current].classList.add("is-active");
  updateThumbs(current);
  titleBar.textContent = slideMeta[current].controlTitle;
  setSliderHeight();
  startAutoplay();
});
</script>

<style>
.cms_slider {
  position: relative;
  overflow: hidden;
  min-height: var(--mentorship-max-height, auto);
}

.mentorship-slide {
  position: absolute;
  inset: 0;
  width: 100%;
  opacity: 0;
  pointer-events: none;
  will-change: opacity, filter;
}

.mentorship-slide.is-active {
  opacity: 1;
  pointer-events: auto;
}

.content_slider {
  perspective: 1200px;
}

.content_slider .headline_slide,
.content_slider .description_mentorship,
.content_slider .button_container {
  transform-style: preserve-3d;
  backface-visibility: hidden;
  will-change: opacity, transform, filter;
}

.content_slider .line {
  display: block;
  transform-style: preserve-3d;
  backface-visibility: hidden;
  will-change: opacity, transform, filter;
}

.title_bar_txt,
.main_image {
  will-change: opacity, filter, transform;
}

.thumbnail_box {
  cursor: pointer;
}

.thumbnail_box.is-active {
  outline: 1px solid rgba(255, 255, 255, 0.4);
}
</style>
